<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <path id="ct-top" d="M 28,100 A 72,72 0 0,1 172,100"/>
    <path id="ct-bot" d="M 28,100 A 72,72 0 0,0 172,100"/>
    <clipPath id="ct-clip">
      <circle cx="100" cy="100" r="86"/>
    </clipPath>
    <!-- Mask punches transparent gaps into the band for highlight lines and ornaments -->
    <mask id="band-mask">
      <rect x="14" y="92" width="172" height="16" fill="white"/>
      <line x1="14" y1="94.5"  x2="186" y2="94.5"  stroke="black" stroke-width="1.2"/>
      <line x1="14" y1="105.5" x2="186" y2="105.5" stroke="black" stroke-width="1.2"/>
      <path d="M 31,100 C 31,95.5 35.5,95.5 38.5,100 C 41.5,104.5 46,104.5 46,100
               C 46,95.5 41.5,95.5 38.5,100 C 35.5,104.5 31,104.5 31,100 Z"
            stroke="black" stroke-width="2" fill="none"/>
      <path d="M 154,100 C 154,95.5 158.5,95.5 161.5,100 C 164.5,104.5 169,104.5 169,100
               C 169,95.5 164.5,95.5 161.5,100 C 158.5,104.5 154,104.5 154,100 Z"
            stroke="black" stroke-width="2" fill="none"/>
    </mask>
  </defs>

  <!-- Outer border rings — stroke only, no white-fill gap needed -->
  <circle cx="100" cy="100" r="95"   fill="none" stroke="currentColor" stroke-width="4.5"/>
  <circle cx="100" cy="100" r="88"   fill="none" stroke="currentColor" stroke-width="1.5"/>

  <!-- Inner content clipped to inner ring -->
  <g clip-path="url(#ct-clip)">

    <!-- Horizontal band with transparent cutout lines and ornaments -->
    <rect x="14" y="92" width="172" height="16" fill="currentColor" mask="url(#band-mask)"/>

    <!-- Tree canopy -->
    <ellipse cx="100" cy="60"  rx="27" ry="23" fill="currentColor"/>
    <ellipse cx="76"  cy="70"  rx="21" ry="18" fill="currentColor"/>
    <ellipse cx="124" cy="70"  rx="21" ry="18" fill="currentColor"/>
    <ellipse cx="58"  cy="80"  rx="16" ry="13" fill="currentColor"/>
    <ellipse cx="142" cy="80"  rx="16" ry="13" fill="currentColor"/>
    <rect x="93" y="82" width="14" height="10" fill="currentColor"/>

    <!-- Tree trunk and roots -->
    <rect x="93" y="108" width="14" height="47" fill="currentColor"/>
    <path d="M 93,145 Q 82,153 78,158 L 93,158 Z" fill="currentColor"/>
    <path d="M 107,145 Q 118,153 122,158 L 107,158 Z" fill="currentColor"/>

    <!-- Lion silhouette -->
    <ellipse cx="50" cy="137" rx="22" ry="12" fill="currentColor"/>
    <circle  cx="65" cy="125" r="13"           fill="currentColor"/>
    <ellipse cx="72" cy="144" rx="5"  ry="6.5" fill="currentColor"/>
    <ellipse cx="59" cy="147" rx="4.5" ry="6"  fill="currentColor"/>
    <ellipse cx="36" cy="144" rx="4.5" ry="7"  fill="currentColor"/>
    <path d="M 29,132 C 20,122 23,113 21,108" stroke="currentColor" stroke-width="4"
          fill="none" stroke-linecap="round"/>
    <circle cx="21" cy="107" r="5" fill="currentColor"/>

    <!-- Couple silhouettes -->
    <circle cx="136" cy="118" r="6.5" fill="currentColor"/>
    <path d="M 136,124 L 134,148" stroke="currentColor" stroke-width="8"  stroke-linecap="round" fill="none"/>
    <path d="M 131,148 L 128,160" stroke="currentColor" stroke-width="4"  stroke-linecap="round" fill="none"/>
    <path d="M 137,148 L 141,160" stroke="currentColor" stroke-width="4"  stroke-linecap="round" fill="none"/>
    <path d="M 136,128 L 128,137" stroke="currentColor" stroke-width="3"  stroke-linecap="round" fill="none"/>
    <path d="M 136,128 L 145,134" stroke="currentColor" stroke-width="3"  stroke-linecap="round" fill="none"/>
    <circle cx="152" cy="120" r="6"   fill="currentColor"/>
    <path d="M 152,126 L 150,148" stroke="currentColor" stroke-width="7"   stroke-linecap="round" fill="none"/>
    <path d="M 147,148 L 144,160" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 153,148 L 157,160" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 152,129 L 144,137" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 152,129 L 161,136" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  </g>

  <!-- Arched text (outside clip — sits in the ring zone) -->
  <text font-family="Georgia,'Times New Roman',serif" font-size="12" font-weight="bold"
        fill="currentColor" letter-spacing="2.8">
    <textPath href="#ct-top" startOffset="50%" text-anchor="middle">COFFEE TREE</textPath>
  </text>
  <text font-family="Georgia,'Times New Roman',serif" font-size="10" font-weight="bold"
        fill="currentColor" letter-spacing="2.5">
    <textPath href="#ct-bot" side="right" startOffset="50%" text-anchor="middle">CAFÉ &amp; BAKERY</textPath>
  </text>
</svg>
