<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Tree — Login</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="theme-dark-login">
  <div class="auth-page">
    <!-- Left branding pane for desktop -->
    <div class="auth-left">
      <div class="auth-left-content">
        <span class="brand-badge">
          <span class="steam-container">
            ☕
            <span class="steam-particle"></span>
            <span class="steam-particle"></span>
            <span class="steam-particle"></span>
          </span>
          Khandala, Lonavala
        </span>
        <h1 class="auth-logo-name">Coffee Tree</h1>
        <p class="auth-left-subtitle">Crafting premium, aromatic coffee blends while managing orders and billing operations seamlessly. Experience the art of hospitality.</p>
      </div>
    </div>
    
    <!-- Right login card pane -->
    <div class="auth-right">
      <div class="auth-card">
        <!-- Logo visible only on mobile/tablet -->
        <div class="auth-logo-mobile">
          <div class="auth-logo-name-mobile">☕ Coffee Tree</div>
          <div class="auth-logo-sub-mobile">Khandala, Lonavala</div>
        </div>
        
        <div class="auth-title">Sign in to continue</div>
        <div class="auth-error" id="auth-error"></div>
        <form id="login-form">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
          </div>
          <div class="remember-row">
            <input type="checkbox" id="remember" checked />
            <label for="remember">Keep me signed in</label>
          </div>
          <button type="submit" class="btn-primary" id="login-btn">Sign In</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Firebase compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCxY-AfWDTB7T2SL4c3GDaz56AWpf--sp0",
      authDomain: "bill-b9548.firebaseapp.com",
      projectId: "bill-b9548",
      storageBucket: "bill-b9548.firebasestorage.app",
      messagingSenderId: "52759095228",
      appId: "1:52759095228:web:4d01cd1f741e16e66c6db9",
      measurementId: "G-4B42Y9FVL3"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // If already logged in, go straight to dashboard
    auth.onAuthStateChanged((user) => {
      if (user) window.location.href = 'dashboard.html';
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('auth-error');

      errEl.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const persistence = remember
          ? firebase.auth.Auth.Persistence.LOCAL
          : firebase.auth.Auth.Persistence.SESSION;
        await auth.setPersistence(persistence);
        await auth.signInWithEmailAndPassword(email, password);
        window.location.href = 'dashboard.html';
      } catch (err) {
        const msgs = {
          'auth/user-not-found': 'No account found with this email.',
          'auth/wrong-password': 'Incorrect password.',
          'auth/invalid-email': 'Please enter a valid email.',
          'auth/invalid-credential': 'Invalid email or password.',
          'auth/too-many-requests': 'Too many attempts. Try again later.',
        };
        errEl.textContent = msgs[err.code] || 'Sign-in failed. Please try again.';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
